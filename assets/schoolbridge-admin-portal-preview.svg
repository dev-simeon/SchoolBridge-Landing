<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SchoolBridge school admin portal</title>
  <desc id="desc">A generic school administration dashboard showing student, subscription, subject and session summaries, quick actions, attendance and upcoming events.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3156d8"/><stop offset="1" stop-color="#183aa8"/></linearGradient>
    <linearGradient id="attendance" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3568ee"/><stop offset="1" stop-color="#6d8df3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#263d74" flood-opacity=".07"/></filter>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#19253a}.muted{fill:#77869e}.tiny{font-size:12px}.small{font-size:15px}.label{font-size:14px;font-weight:600;letter-spacing:.04em}.value{font-size:30px;font-weight:750}.card{fill:#fff;stroke:#e3e9f3;stroke-width:1.5}.nav{font-size:16px;font-weight:550;fill:#53647e}.navactive{font-size:16px;font-weight:650;fill:#2454d8}
    </style>
  </defs>
