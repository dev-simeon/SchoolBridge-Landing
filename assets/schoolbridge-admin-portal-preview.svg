    <rect x="862" y="698" width="45" height="49" rx="9" fill="#e9f7ee"/><text x="884" y="719" text-anchor="middle" class="tiny" fill="#31915b" font-weight="700">02</text><text x="884" y="736" text-anchor="middle" font-size="10" fill="#71819a">NOV</text><text x="925" y="717" font-size="15" font-weight="650">Mid-term break</text><text x="925" y="738" class="tiny muted">School holiday · All day</text>
