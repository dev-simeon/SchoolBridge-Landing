    <rect class="card" x="576" y="395" width="258" height="101" rx="12"/><rect x="595" y="416" width="36" height="36" rx="10" fill="#f3edff"/><path d="M603 424h20v16h-20zM608 421v6m10-6v6m-15 2h20" fill="none" stroke="#8b55d6" stroke-width="1.7" stroke-linecap="round"/><text x="645" y="435" font-size="16" font-weight="700">Subscriptions</text><text x="645" y="460" class="tiny muted">Manage school access</text>
